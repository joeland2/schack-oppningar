# Every 3 hours: each pro's and VIP's profile read by the site in a headless browser (tools/snapshot_pros.py)
# from the games kept on our server, pushed with those games to the branch pros-data, which profile.js reads.
# The branch is one commit, replaced each time, so the repo does not grow; [skip ci] keeps Cloudflare from building it.
# Run by hand (or by the admin page's button) with refresh on: every account's games fetched again first.
name: Snapshot pros
on:
  schedule: [{ cron: '20 */3 * * *' }]
  workflow_dispatch:
    inputs:
      refresh: { description: 'Fetch every account again from Lichess and Chess.com first', type: boolean, default: false }
      accounts: { description: 'Accounts (space-separated); empty for all', required: false, default: '' }
permissions: { contents: write }
concurrency: { group: snapshot-pros, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FN: https://duhlvhjtxoofgnjegspa.supabase.co/functions/v1/pros
      KEY: sb_publishable_6jWrlp6aNe4REB4v-uebxA_giKYde2o # the site's public key, as in the page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install chess==1.11.2 playwright && playwright install --with-deps chromium
      - name: Fetch every account again
        if: inputs.refresh
        run: |
          n=$(python -c "import sys; sys.path.insert(0, 'tools'); from analyse_pros import accounts; print(len(accounts()))")
          for i in $(seq "$n"); do curl -s -m 150 -X POST "$FN?refresh=1" -H "apikey: $KEY" || true; echo; sleep 2; done
          curl -s -m 150 -X POST "$FN?week=1" -H "apikey: $KEY"; echo
      - name: The last snapshots, so an account that fails keeps its old one
        run: git clone -q --depth 1 -b pros-data "https://github.com/${{ github.repository }}" out || mkdir -p out
      - run: python tools/snapshot_pros.py ${{ inputs.accounts }}
      - name: Push to pros-data
        run: |
          cd out && rm -rf .git && git init -q -b pros-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm 'Pros: profiles snapshotted [skip ci]'
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pros-data
