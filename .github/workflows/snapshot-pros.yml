# Every morning: each pro's and streamer's profile read by the site in a headless browser (tools/snapshot_pros.py)
# and committed as data/pros/*.json, so their cards show at once for every visitor.
name: Snapshot pros
on:
  schedule: [{ cron: '0 5 * * *' }]
  workflow_dispatch:
    inputs:
      accounts: { description: 'Accounts (space-separated); empty for all', required: false, default: '' }
permissions: { contents: write }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install chess==1.11.2 playwright && playwright install --with-deps chromium
      - run: python tools/snapshot_pros.py ${{ inputs.accounts }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pros
          git diff --cached --quiet || (git commit -m 'Pros: profiles snapshotted' && git pull --rebase && git push)
