<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Think Like the Pros · Chess Labs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:site_name" content="Chess Labs">
  <meta property="og:title" content="Think Like the Pros · Chess Labs">
  <meta property="og:description" content="Find the move top players found in their real games, then see Stockfish explain why it works.">
  <meta property="og:image" content="https://chesslabs.gg/og.png">
  <meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Find the move top players found in their real games, then see Stockfish explain why it works.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css?v=20261102154900">
  <script src="move.js?v=20261102154900"></script>
  <script src="header.js?v=20261102154900" defer></script>
  <script src="theme.js?v=20261102154900"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="./">Chess<span>Labs</span></a>
      <nav class="top-nav" aria-label="Sections"><a href="./#openings">Openings</a><a href="practice.html">My practice</a><a href="profile.html">Profile</a></nav>
      <form class="top-search" action="profile.html" role="search"><input name="u" type="search" required maxlength="30" pattern="[A-Za-z0-9_\-]{2,30}" placeholder="Find a player" aria-label="Find a player on Lichess or Chess.com" title="A Lichess username" autocomplete="off" autocapitalize="off" spellcheck="false"></form>
      <details class="top-players"><summary title="Your starred players" aria-label="Your starred players"><svg class="ico ico-solid" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></summary><div class="top-players-menu"></div></details>
      <button id="theme" class="ghost theme" type="button" aria-label="Switch theme"></button>
    </div>
  </header>

  <main class="wrap layout">
    <section class="play">
      <div class="board-frame">
        <div id="board" class="board" role="group" aria-label="Chessboard"></div>
      </div>
      <div class="controls">
        <button id="hint" type="button">Hint</button>
        <button id="show" type="button">Show move</button>
        <button id="next" type="button" class="primary">Next</button>
      </div>
    </section>

    <aside class="panel">
      <div class="op-head">
        <h1 id="title"></h1>
        <p id="intro" class="info"></p>
      </div>
      <p id="message" class="message" aria-live="polite"></p>
      <div id="explain" class="explain" hidden></div>
    </aside>

    <nav id="items" class="list" aria-label="Exercises"></nav>
  </main>

  <script type="module" src="pros.js?v=20261102154900"></script>
</body>
</html>
