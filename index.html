<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Öppningsboken</title>
  <meta name="description" content="Öva schacköppningar drag för drag. Spela huvudlinjen, få direkt feedback och se vilka öppningar som sitter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="./">Öppnings<span>boken</span></a>
      <button id="weakest" class="ghost" type="button">Öva svagaste</button>
    </div>
  </header>

  <main class="wrap layout">
    <section class="play">
      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="Schackbräde"></div>
      </div>
      <div class="controls">
        <button id="hint" type="button">Ledtråd</button>
        <button id="show" type="button">Visa draget</button>
        <button id="restart" type="button" class="primary">Börja om</button>
      </div>
    </section>

    <aside class="panel">
      <div class="op-head">
        <p class="meta"><span id="op-eco" class="eco"></span> <span id="op-side"></span></p>
        <h1 id="op-title"></h1>
        <p id="op-info" class="info"></p>
      </div>
      <p id="message" class="message" aria-live="polite"></p>
      <div class="progress">
        <div class="track"><div id="bar" class="fill"></div></div>
        <span id="progress"></span>
      </div>
      <ol id="moves" class="moves"></ol>
    </aside>

    <nav id="openings" class="list" aria-label="Öppningar"></nav>
  </main>

  <footer class="wrap foot">Klicka på en pjäs och sedan på rutan du vill flytta till. Tre felfria genomgångar så sitter öppningen.</footer>

  <script type="module" src="app.js"></script>
</body>
</html>
