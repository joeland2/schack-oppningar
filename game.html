<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game Review</title>
  <meta name="description" content="Replay one of your Lichess games: how it went, the moves that decided it, and what to take from it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css?v=20261028221010">
  <script src="header.js?v=20261028221010" defer></script>
  <script src="theme.js?v=20261028221010"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="./">Chess<span>Trainer</span></a>
      <nav class="top-nav" aria-label="Sections"><a href="./">Openings</a><a href="basics.html">Basics</a><a href="pros.html">Puzzles</a><a href="practice.html">My practice</a><a href="profile.html" aria-current="page">Profile</a></nav>
      <form class="top-search" action="profile.html" role="search"><input name="u" type="search" required maxlength="30" pattern="[A-Za-z0-9_\-]{2,30}" placeholder="Find a player" aria-label="Find a Lichess player" title="A Lichess username" autocomplete="off" autocapitalize="off" spellcheck="false"></form>
      <details class="top-players"><summary title="Your starred players" aria-label="Your starred players">★</summary><div class="top-players-menu"></div></details>
      <button id="theme" class="ghost theme" type="button" aria-label="Switch theme"></button>
    </div>
  </header>

    <main class="wrap layout game-layout">
    <section class="play">
      <p id="top-player" class="gm-player"></p>
      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="Chessboard"></div>
      </div>
      <p id="bottom-player" class="gm-player"></p>
      <div class="controls">
        <button id="first" type="button" aria-label="First move">⏮</button>
        <button id="prev" type="button" aria-label="Previous move">◀</button>
        <button id="next" type="button" aria-label="Next move">▶</button>
        <button id="last" type="button" aria-label="Last move">⏭</button>
        <button id="flip" type="button" class="ghost" aria-label="Flip the board">⇅</button>
      </div>
      <p id="here" class="gm-here" aria-live="polite"></p>
    </section>

    <aside class="panel">
      <p id="profile-msg" class="info" aria-live="polite"></p>
      <div id="game"></div>
    </aside>
  </main>

  <script type="module" src="game.js?v=20261028221010"></script>
</body>
</html>
