<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="./">Chess<span>Labs</span></a>
      <nav class="top-nav" aria-label="Sections"><a href="./#openings">Openings</a><a href="practice.html">My practice</a><a href="profile.html">Profile</a></nav>
      <form class="top-search" action="profile.html" role="search"><input name="u" type="search" required maxlength="30" pattern="[A-Za-z0-9_\-]{2,30}" placeholder="Find a player" aria-label="Find a player on Lichess or Chess.com" title="A Lichess username" autocomplete="off" autocapitalize="off" spellcheck="false"></form>

    </div>
  </header>

  <main class="wrap profile stars" data-snap="st-msg st-split">
    <h1 class="pf-h1">Pro &amp; VIP</h1>
    <p class="info">The best players and the people you watch, Lichess and Chess.com together. Pro and VIP of the week are from last week; the lists count the last 7 days.</p>
    <p id="st-msg" class="info" aria-live="polite">Loading…</p>
    <div id="st-split" class="st-split" aria-hidden="true">
      <div class="st-wk sk"></div><div class="st-wk sk"></div>
      <ol class="st-rows st-pro"><li class="st-row sk"></li><li class="st-row sk"></li><li class="st-row sk"></li><li class="st-row sk"></li></ol><ol class="st-rows st-vip"><li class="st-row sk"></li><li class="st-row sk"></li><li class="st-row sk"></li><li class="st-row sk"></li></ol>
    </div>
  </main>

  <script type="module" src="stars.js?v=20261102141013"></script>
