<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trap video frames</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@500;700&display=swap">
<style>body { margin: 0; background: #12100e; } canvas { width: 360px; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<!-- Frames of a vertical (9:16) short, drawn on a canvas. tools/make_trap_videos.mjs calls setup(i) for a
     trap's index in traps.js (or setupCard(src) for the play style video), then frame(n) for each frame;
     setup returns the sound cues, which the script turns into the audio track. -->
<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm';
import { NAMED_TRAPS } from '/traps.js';

const FPS = 30, W = 1080, H = 1920, B = 1000, BX = 40, BY = 500, SQ = B / 8, SLIDE = 6;
const C = { bg: '#12100e', ink: '#f4efe6', muted: '#a8a093', hot: '#ff6a2f', light: '#efe8db', dark: '#b58863', bad: '#ff4d4d', good: '#5fc48a', gold: '#ffc94a' };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const img = {};
await Promise.all(['w', 'b'].flatMap((c) => 'PNBRQK'.split('').map((p) => new Promise((ok) => {
  const i = new Image(); i.onload = ok; i.src = `/pieces/${c}${p}.svg`; img[c + p] = i;
}))));
await document.fonts.load('80px Anton'); await document.fonts.load('700 40px Geist');

let T, plan, total, cues, card;
const sideName = (c) => (c === 'w' ? 'White' : 'Black');
const num = (moves, i) => (i % 2 ? `${Math.floor(i / 2) + 1}...` : `${i / 2 + 1}.`) + moves[i];
const time = (list) => { let at = 0; for (const p of list) { p.from = at; at += Math.round(p.s * FPS); } return at; };

// The beats: quick moves up to the slip, the slip with a bang, a pause to find the answer, the punishment.
// extra: Stockfish's moves on to mate where the trap's line stops short of it (tools/trap-video-mates.json).
window.setup = (i, extra = []) => {
  const t0 = NAMED_TRAPS[i], t = extra.length ? { ...t0, moves: [...t0.moves, ...extra], win: 'mate' } : t0, g = new Chess(), fens = [g.fen()], made = [];
  for (const m of t.moves) { made.push(g.move(m)); fens.push(g.fen()); }
  const me = sideName(t.side);
  plan = [{ kind: 'intro', ply: 0, s: 1.5 }];
  t.moves.forEach((m, k) => {
    if (k < t.slip) plan.push({ kind: 'move', ply: k + 1, s: 0.42, anim: true });
    else if (k === t.slip) plan.push({ kind: 'slip', ply: k + 1, s: 1.7, anim: true }, { kind: 'quiz', ply: k + 1, s: 2.4 });
    else plan.push({ kind: (k - t.slip) % 2 ? 'punish' : 'reply', ply: k + 1, s: 0.95, anim: true });
  });
  plan.push({ kind: 'end', ply: t.moves.length, s: 2.3 }, { kind: 'outro', ply: t.moves.length, s: 2.3 });
  total = time(plan);
  T = { ...t, fens, made, me };
  card = null;
  cues = [{ f: 0, type: 'hit' }];
  for (const p of plan) {
    const m = p.anim && made[p.ply - 1];
    if (m) cues.push({ f: p.from + SLIDE - 1, type: m.san.includes('#') ? 'mate' : m.captured ? 'capture' : 'move' });
    if (p.kind === 'slip') cues.push({ f: p.from + SLIDE, type: 'slip' });
    if (p.kind === 'quiz') for (const s of [0, 0.8, 1.6]) cues.push({ f: p.from + Math.round(s * FPS), type: 'tick' });
    if (p.kind === 'punish') cues.push({ f: p.from, type: 'whoosh' });
    if (p.kind === 'end') cues.push({ f: p.from, type: 'win' });
  }
  return { total, name: t.name, cues, mate: t.moves.at(-1).endsWith('#') };
};

const xy = (sq) => { const f = sq.charCodeAt(0) - 97, r = 8 - Number(sq[1]); return T.side === 'w' ? [f, r] : [7 - f, 7 - r]; };
const centre = (sq) => { const [f, r] = xy(sq); return [BX + (f + 0.5) * SQ, BY + (r + 0.5) * SQ]; };
const ease = (e) => (e < 0.5 ? 2 * e * e : 1 - (-2 * e + 2) ** 2 / 2);
const pop = (k, from = 1.6) => (k >= 8 ? 1 : from + (1 - from) * ease(k / 8)); // a stamp that lands
function arrow(from, to, color) {
  const [x0, y0] = centre(from), [x1, y1] = centre(to), a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0) - 30;
  ctx.save(); ctx.translate(x0, y0); ctx.rotate(a); ctx.globalAlpha = 0.85; ctx.fillStyle = color;
  ctx.fillRect(0, -14, L - 34, 28); ctx.beginPath(); ctx.moveTo(L, 0); ctx.lineTo(L - 46, -38); ctx.lineTo(L - 46, 38); ctx.fill(); ctx.restore();
}
function board(p, k) {
  const ply = p.ply, g = new Chess(T.fens[ply]), m = ply ? T.made[ply - 1] : null;
  const tone = ply === T.slip + 1 ? 'rgba(255,77,77,.6)' : ply > T.slip + 1 ? 'rgba(95,196,138,.55)' : 'rgba(255,170,40,.45)';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { ctx.fillStyle = (r + f) % 2 ? C.dark : C.light; ctx.fillRect(BX + f * SQ, BY + r * SQ, SQ, SQ); }
  if (m) for (const sq of [m.from, m.to]) { const [f, r] = xy(sq); ctx.fillStyle = tone; ctx.fillRect(BX + f * SQ, BY + r * SQ, SQ, SQ); }
  // Only a beat that plays a move slides its piece; the beats that hold the position keep it still.
  const e = p.anim ? Math.min(1, k / SLIDE) : 1;
  for (const row of g.board()) for (const pc of row) {
    if (!pc) continue;
    let [f, r] = xy(pc.square);
    if (m && pc.square === m.to && e < 1) { const [f0, r0] = xy(m.from); f = f0 + (f - f0) * ease(e); r = r0 + (r - r0) * ease(e); }
    ctx.drawImage(img[pc.color + pc.type.toUpperCase()], BX + f * SQ + 4, BY + r * SQ + 4, SQ - 8, SQ - 8);
  }
  if (p.kind === 'punish' && k < SLIDE + 4) arrow(m.from, m.to, C.good);
  if (m && ply === T.slip + 1 && (p.kind === 'quiz' || k >= SLIDE)) { const [x, y] = centre(m.to); badge(x + SQ / 2 - 10, y - SQ / 2 + 10, '??', C.bad, p.kind === 'slip' ? pop(k - SLIDE, 2.4) : 1); }
  if (m?.san.endsWith('#') && (!p.anim || k >= SLIDE)) { const [x, y] = centre(m.to); badge(x + SQ / 2 - 10, y - SQ / 2 + 10, '#', C.good, p.anim ? pop(k - SLIDE, 2.4) : 1); }
}
function badge(x, y, text, color, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill();
  ctx.fillStyle = '#141414'; ctx.font = '700 40px Geist'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 3); ctx.restore();
}
function wrap(text, x, y, max, lh) {
  let line = '';
  for (const w of text.split(' ')) { if (ctx.measureText(line + w).width > max && line) { ctx.fillText(line.trim(), x, y); y += lh; line = ''; } line += w + ' '; }
  ctx.fillText(line.trim(), x, y); return y;
}
function stamp(text, y, color, font, s) {
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s); ctx.fillStyle = color; ctx.font = font; ctx.textAlign = 'center'; wrap(text, 0, 0, 1000 / s, parseInt(font.match(/(\d+)px/)[1]) * 1.05); ctx.restore();
}
const shakeOf = (n, k, amp) => (k < 10 ? [Math.sin(n * 2.1) * amp * (1 - k / 10), Math.cos(n * 2.7) * amp * (1 - k / 10)] : [0, 0]);
function outro() {
  stamp('LEARN EVERY OPENING TRAP', 700, C.hot, '130px Anton', 1);
  ctx.fillStyle = C.ink; ctx.font = '700 70px Geist'; ctx.textAlign = 'center'; ctx.fillText('chesslabs.gg', W / 2, 1180);
  ctx.fillStyle = C.muted; ctx.font = '500 42px Geist'; wrap('Free. Practise against the moves real players at your rating make.', W / 2, 1290, 860, 56);
  ctx.fillStyle = C.ink; ctx.font = '700 46px Geist'; ctx.fillText('Follow for a new trap every day', W / 2, 1600);
}

window.frame = (n) => {
  if (card) return cardFrame(n);
  const p = plan.findLast((x) => x.from <= n), k = n - p.from, m = p.ply ? T.made[p.ply - 1] : null;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.hot; ctx.fillRect(0, 0, W * (n + 1) / total, 12); // how far through the short
  if (p.kind === 'outro') { outro(); return cv.toDataURL('image/jpeg', 0.92); }
  // The board shakes when the slip lands, on a capture or check in the punishment, and at the end.
  const hit = (p.kind === 'slip' && k >= SLIDE) || ((p.kind === 'punish' || p.kind === 'reply') && k >= SLIDE && /[x+#]/.test(m.san));
  const [dx, dy] = hit ? shakeOf(n, k - SLIDE, p.kind === 'slip' ? 22 : 12) : p.kind === 'end' ? shakeOf(n, k, 16) : [0, 0];
  ctx.textAlign = 'center';
  ctx.fillStyle = C.ink; ctx.font = '108px Anton'; if (ctx.measureText(T.name.toUpperCase()).width > 1000) ctx.font = '84px Anton'; const y = wrap(T.name.toUpperCase(), W / 2, 150, 1000, 92);
  ctx.fillStyle = C.muted; ctx.font = '500 42px Geist'; ctx.fillText(`A trap for ${T.me}`, W / 2, Math.min(y + 72, 440));
  ctx.save(); ctx.translate(dx, dy); board(p, k); ctx.restore();
  // A red flash as the slip lands, a gold one at the end.
  const flash = p.kind === 'slip' && k >= SLIDE ? [C.bad, 0.45 * Math.max(0, 1 - (k - SLIDE) / 9)] : p.kind === 'end' ? [C.gold, 0.35 * Math.max(0, 1 - k / 9)] : null;
  if (flash) { ctx.globalAlpha = flash[1]; ctx.fillStyle = flash[0]; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  const cy = BY + B + 120;
  if (p.kind === 'intro') stamp('CAN YOU SPOT THE TRAP?', cy + 20, C.hot, '96px Anton', pop(k, 1.5));
  else if (p.kind === 'move') { ctx.fillStyle = C.ink; ctx.font = '700 64px Geist'; ctx.fillText(num(T.moves, p.ply - 1), W / 2, cy); }
  else if (p.kind === 'slip') { stamp(`${num(T.moves, p.ply - 1)}??`, cy + 10, C.bad, '120px Anton', k >= SLIDE ? pop(k - SLIDE, 1.8) : 1); if (k >= SLIDE + 6) { ctx.fillStyle = C.ink; ctx.font = '700 48px Geist'; ctx.fillText('Looks natural. It loses.', W / 2, cy + 110); } }
  else if (p.kind === 'quiz') {
    stamp(`${T.me.toUpperCase()} TO PLAY: FIND THE WIN`, cy, C.ink, '76px Anton', 1);
    // The countdown sits on the board, dimmed, so the eye stays on the position.
    const left = 3 - Math.floor(k / (0.8 * FPS));
    ctx.globalAlpha = 0.45; ctx.fillStyle = '#000'; ctx.fillRect(BX, BY, B, B); ctx.globalAlpha = 1;
    stamp(String(Math.max(1, left)), BY + B / 2 + 120, C.hot, '340px Anton', pop(k % Math.round(0.8 * FPS), 1.7));
  } else if (p.kind === 'punish' || p.kind === 'reply') stamp(`${num(T.moves, p.ply - 1)}${p.kind === 'punish' && !/[#]/.test(m.san) ? '!' : ''}`, cy + 10, p.kind === 'punish' ? C.good : C.ink, '112px Anton', p.kind === 'punish' && k >= SLIDE ? pop(k - SLIDE, 1.5) : 1);
  else if (p.kind === 'end') stamp(T.win === 'mate' ? 'CHECKMATE!' : (/attack/.test(T.win) ? `${T.me.toUpperCase()} CRASHES THROUGH!` : `${T.me.toUpperCase()} WINS ${T.win.split(/[,:]/)[0].toUpperCase()}!`), cy + 20, C.gold, '104px Anton', pop(k, 1.9));
  ctx.fillStyle = C.hot; ctx.font = '700 42px Geist'; ctx.fillText('chesslabs.gg', W / 2, 1860);
  return cv.toDataURL('image/jpeg', 0.92);
};

// The play style video: a quick run through the styles, then a real player card lands.
const STYLES = ['STRIKER', 'SOLID BUILDER', 'TRICKSTER', 'HOUDINI', 'GRINDER', 'TIME SCRAMBLER', 'GIANT KILLER', 'ENDGAME ARTIST', 'FIGHTER', 'SPECIALIST', 'EXPLORER', 'KILLER INSTINCT'];
window.setupCard = async (src) => {
  card = new Image(); await new Promise((ok) => { card.onload = ok; card.src = src; });
  plan = [{ kind: 'hook', s: 2.2 }, { kind: 'spin', s: 3.6 }, { kind: 'card', s: 4.6 }, { kind: 'cta', s: 3 }];
  total = time(plan);
  cues = [{ f: 0, type: 'hit' }];
  const spin = plan[1];
  for (let f = 0, i = 0; f < spin.s * FPS; i++) { cues.push({ f: spin.from + Math.round(f), type: 'tick' }); f += 3 + i * 0.35; }
  cues.push({ f: plan[2].from, type: 'win' }, { f: plan[3].from, type: 'hit' });
  return { total, name: 'Your chess style', cues };
};
function cardFrame(n) {
  const p = plan.findLast((x) => x.from <= n), k = n - p.from;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.hot; ctx.fillRect(0, 0, W * (n + 1) / total, 12);
  ctx.textAlign = 'center';
  if (p.kind === 'hook') {
    stamp('YOUR GAMES SAY WHAT KIND OF PLAYER YOU ARE', 640, C.ink, '130px Anton', pop(k, 1.4));
    if (k > 20) { ctx.fillStyle = C.muted; ctx.font = '700 52px Geist'; ctx.fillText('Which one are you?', W / 2, 1300); }
  } else if (p.kind === 'spin') {
    // The names flick past and slow down, like a wheel coming to rest.
    let f = 0, i = 0; while (f + 3 + i * 0.35 <= k) { f += 3 + i * 0.35; i++; }
    ctx.fillStyle = C.muted; ctx.font = '700 52px Geist'; ctx.fillText('Your style is…', W / 2, 760);
    stamp(STYLES[i % STYLES.length], 980, i % 2 ? C.hot : C.ink, '150px Anton', pop(k - f, 1.3));
  } else if (p.kind === 'card' || p.kind === 'cta') {
    const s = p.kind === 'card' ? pop(k, 0.6) : 1, h = (p.kind === 'cta' ? 1000 : 1180) * s, w = h * card.width / card.height, top = p.kind === 'cta' ? 90 : 200 + (1180 - h) / 2;
    if (p.kind === 'card' && k < 9) { ctx.globalAlpha = 0.35 * (1 - k / 9); ctx.fillStyle = C.gold; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    ctx.drawImage(card, (W - w) / 2, top, w, h);
    if (p.kind === 'card') { ctx.fillStyle = C.ink; ctx.font = '700 50px Geist'; ctx.fillText('Your skills, style and openings,', W / 2, 1520); ctx.fillText('from your real games', W / 2, 1586); }
    else { stamp('GET YOUR CARD FREE', 1290, C.hot, '120px Anton', pop(k, 1.4)); ctx.fillStyle = C.ink; ctx.font = '700 66px Geist'; ctx.fillText('chesslabs.gg', W / 2, 1450); ctx.fillStyle = C.muted; ctx.font = '500 40px Geist'; ctx.fillText('Lichess or Chess.com name, nothing else', W / 2, 1540); }
  }
  if (p.kind !== 'cta') { ctx.fillStyle = C.hot; ctx.font = '700 42px Geist'; ctx.fillText('chesslabs.gg', W / 2, 1860); }
  return cv.toDataURL('image/jpeg', 0.92);
}
window.ready = true;
</script>
</body>
</html>
