<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Practise Openings</title>
  <meta name="description" content="Practise chess openings move by move against the replies real Lichess players at your level play, with instant feedback.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="./">Chess<span>Trainer</span></a>
      <div class="account">
        <label>Lichess blitz rating <input id="rating" type="number" min="400" max="3200" step="50" inputmode="numeric"></label>
        <button id="weakest" class="ghost" type="button">Practise weakest</button>
      </div>
    </div>
  </header>

  <section id="picker" class="wrap picker">
    <h1>Practise openings</h1>
    <p id="pick-msg" class="info" aria-live="polite"></p>
    <nav id="openings" class="list" aria-label="Openings"></nav>
  </section>

  <main id="trainer" class="wrap layout" hidden>
    <section class="play">
      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="Chessboard"></div>
      </div>
      <div class="controls">
        <div class="mode" role="group" aria-label="Mode">
          <button id="mode-learn" type="button" aria-pressed="true">Learn</button>
          <button id="mode-try" type="button" aria-pressed="false">Try</button>
        </div>
        <button id="hint" type="button">Hint</button>
        <button id="show" type="button">Show move</button>
        <button id="restart" type="button" class="primary">Restart</button>
      </div>
    </section>

    <aside class="panel">
      <button id="back" class="ghost back" type="button">← All openings</button>
      <div class="op-head">
        <p class="meta"><span id="op-eco" class="eco"></span> <span id="op-side"></span></p>
        <h1 id="op-title"></h1>
        <p id="op-info" class="info"></p>
        <p id="op-var" class="meta"></p>
      </div>
      <p id="message" class="message" aria-live="polite"></p>
      <div class="progress">
        <div class="track"><div id="bar" class="fill"></div></div>
        <span id="progress"></span>
      </div>
      <ol id="moves" class="moves"></ol>
    </aside>
  </main>

  <footer class="wrap foot">Click a piece, then the square to move it to. Your opponent plays the replies real Lichess players at your blitz rating ± 200 play in blitz, most common first. Learn shows every move; Try tests you, and a line clears when you play it without mistakes.</footer>

  <script type="module" src="app.js"></script>
</body>
</html>
